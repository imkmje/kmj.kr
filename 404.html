<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KMJ</title>
<style>
  body { margin:0; font-family:-apple-system,sans-serif; background:#e8eaef; color:#1a1c22;
         display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .box { text-align:center; padding:48px 24px; }
  .code { font-size:72px; font-weight:800; color:#3b7df8; line-height:1; margin-bottom:12px; }
  .msg  { font-size:16px; color:#7e8394; margin-bottom:32px; }
  .home { display:inline-flex; align-items:center; gap:8px; padding:12px 28px;
          background:#3b7df8; color:#fff; border-radius:999px; font-weight:700;
          font-size:14px; text-decoration:none; transition:transform .2s; }
  .home:hover { transform:translateY(-2px); }
  #loading .spinner {
    width:32px; height:32px; border:3px solid #dddfe6; border-top-color:#3b7df8;
    border-radius:50%; animation:spin .7s linear infinite; margin:0 auto 16px;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div id="loading" class="box">
  <div class="spinner"></div>
  <div class="msg">리다이렉트 중…</div>
</div>
<div id="notFound" class="box" style="display:none">
  <div class="code">404</div>
  <div class="msg">페이지를 찾을 수 없습니다.</div>
  <a href="/" class="home">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    홈으로
  </a>
</div>
<script>
(function () {
  var path = location.pathname; // e.g. "/go/abc12"
  var show404 = function () {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('notFound').style.display = 'block';
    document.title = '404 — KMJ';
  };

  if (!path.startsWith('/go/')) { show404(); return; }

  var code = path.slice(4); // strip "/go/"
  if (!code) { show404(); return; }

  fetch('https://raw.githubusercontent.com/imkmje/kmj.kr/main/data.json?t=' + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var links = data.links || [];
      var found = links.find(function (l) { return l.code === code; });
      if (found && found.url) {
        location.replace(found.url);
      } else {
        show404();
      }
    })
    .catch(show404);
})();
</script>
</body>
</html>
